name: CI

on:
  pull_request:
  push:
    branches:
      - master

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run tests
        run: 'npm run test'

      - name: Run build
        run: 'npm run build'

  # Single stable check to require in branch protection. Depends on every job
  # above; `if: always()` makes it run (and fail) even when a dependency fails
  # or is skipped, instead of being skipped itself (a skipped required check
  # blocks merging forever).
  ci-ok:
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
